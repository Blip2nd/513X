<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --asphalt:#0E1217;
  --panel:#171D25;
  --panel2:#1F2630;
  --line:#2A333F;
  --ink:#EAF0F6;
  --dim:#8494A5;
  --dimmer:#5D6B7A;
  --green:#35D07F;
  --amber:#FFB023;
  --red:#FF4438;
  --display:"Barlow Condensed","Avenir Next Condensed","HelveticaNeue-CondensedBold","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Inter",system-ui,-apple-system,sans-serif;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--asphalt);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  padding-bottom:120px;
  overscroll-behavior-y:contain;
}
input,button,select,textarea{font-family:inherit}

/* ---------- shift light strip: signature element ---------- */
.shift{
  position:sticky;top:0;z-index:40;
  display:flex;gap:3px;
  padding:8px var(--pad) 7px;
  background:linear-gradient(180deg,#0E1217 70%,rgba(14,18,23,0));
}
.seg{
  flex:1;height:7px;border-radius:1px;
  background:#222B36;
  transition:background .18s ease, box-shadow .18s ease;
}
.seg.on-g{background:var(--green);box-shadow:0 0 9px rgba(53,208,127,.55)}
.seg.on-a{background:var(--amber);box-shadow:0 0 9px rgba(255,176,35,.55)}
.seg.on-r{background:var(--red);box-shadow:0 0 10px rgba(255,68,56,.6)}
@keyframes redline{0%,100%{opacity:1}50%{opacity:.35}}
.shift.redline .seg{animation:redline .55s steps(1) infinite}

/* ---------- header ---------- */
.head{padding:2px var(--pad) 12px}
.headtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.headtop>div:first-child{min-width:0}
.eyebrow{
  font-family:var(--display);font-weight:600;font-size:12px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--dimmer);
}
.date{
  font-family:var(--display);font-weight:700;
  font-size:32px;line-height:1.02;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums;margin-top:2px;
  white-space:nowrap;
}
@media (max-width:400px){ .date{font-size:28px} }
@media (max-width:360px){ .date{font-size:24px} .plate{font-size:19px;padding:4px 6px 2px;border-width:2px} }
.plate{
  font-family:var(--display);font-weight:700;font-size:23px;line-height:1;
  color:var(--red);border:2px solid var(--red);border-radius:5px;
  padding:5px 8px 3px;letter-spacing:.02em;flex:none;
}
.progline{
  display:flex;align-items:baseline;gap:8px;margin-top:9px;
  font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;
}
.progline b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.progline span{font-size:12px;color:var(--dim);letter-spacing:.18em}
.chip{
  margin-left:auto;border:1px solid var(--line);border-radius:99px;
  padding:3px 9px 2px;font-size:11px!important;letter-spacing:.12em!important;
  color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.chip.ok{border-color:#2E5140;color:var(--green)}
.chip.bad{border-color:var(--red);color:var(--red)}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:22px;z-index:35;
  display:flex;gap:6px;overflow-x:auto;
  padding:6px var(--pad) 10px;
  background:var(--asphalt);
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);border-radius:4px;padding:8px 11px 6px;
  font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:baseline;gap:7px;
}
.tab .ct{font-size:12px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:#0E1217}
.tab[aria-selected="true"] .ct{color:rgba(14,18,23,.62)}
.tab.full[aria-selected="false"]{border-color:#2E5140;color:var(--green)}
.tab.full[aria-selected="false"] .ct{color:var(--green)}

/* ---------- panels ---------- */
.wrap{padding:14px var(--pad) 0}
.zonehead{margin:2px 0 11px}
.zonehead h2{
  font-family:var(--display);font-weight:700;font-size:21px;
  letter-spacing:.02em;margin:0;text-transform:uppercase;
}
.zonehead p{margin:3px 0 0;font-size:13.5px;color:var(--dim)}

.row{
  background:var(--panel);border:1px solid var(--line);
  border-radius:6px;margin-bottom:8px;overflow:hidden;
}
.row.done{border-color:#2E5140;background:#141E19}
.rowtop{display:flex;align-items:stretch;gap:0}
.tick{
  flex:none;width:52px;border:0;background:transparent;
  border-right:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.row.done .tick{border-right-color:#2E5140}
.box{
  width:23px;height:23px;border:2px solid var(--dimmer);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s ease,border-color .14s ease;
}
.row.done .box{background:var(--green);border-color:var(--green)}
.box svg{width:14px;height:14px;opacity:0;transition:opacity .14s ease}
.row.done .box svg{opacity:1}
.meta{
  flex:1;min-width:0;text-align:left;background:transparent;border:0;
  color:inherit;padding:11px 12px;cursor:pointer;
}
.name{
  font-family:var(--display);font-weight:600;font-size:18.5px;
  line-height:1.16;letter-spacing:.005em;
}
.row.done .name{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(132,148,165,.5)}
.presc{
  font-family:var(--display);font-size:14.5px;letter-spacing:.05em;
  color:var(--amber);margin-top:3px;font-variant-numeric:tabular-nums;
}
.row.done .presc{color:var(--dimmer)}
.musc{font-size:12.5px;color:var(--dim);margin-top:2px}
.cue{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}

/* ---------- log drawer ---------- */
.drawer{display:none;border-top:1px solid var(--line);padding:11px 12px 12px;background:var(--panel2)}
.row.open .drawer{display:block}
.row.done .drawer{border-top-color:#2E5140}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.field label{
  display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:3px;
}
.field input{
  width:100%;background:var(--asphalt);border:1px solid var(--line);
  color:var(--ink);border-radius:4px;padding:9px 8px;font-size:16px;
  font-variant-numeric:tabular-nums;
}
.field input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
textarea{
  width:100%;margin-top:7px;background:var(--asphalt);border:1px solid var(--line);
  color:var(--ink);border-radius:4px;padding:9px 8px;font-size:15px;
  resize:vertical;min-height:44px;
}
.rest{
  margin-top:8px;width:100%;background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:4px;padding:9px;cursor:pointer;
  font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}
.rest.running{border-color:var(--amber);color:var(--amber)}

/* ---------- surprise ---------- */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.controls .field select{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:10px 8px;font-size:15px;
}
.roll{
  width:100%;margin-bottom:11px;background:var(--amber);border:0;color:#0E1217;
  border-radius:5px;padding:14px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:17px;
  letter-spacing:.16em;text-transform:uppercase;
}
.roll:active{transform:translateY(1px)}
.empty{
  border:1px dashed var(--line);border-radius:6px;padding:22px 16px;
  text-align:center;color:var(--dim);font-size:14px;
}

/* ---------- cooldown ---------- */
.stretch{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 12px;margin-bottom:8px}
.stretch .grp{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.stretch .how{font-size:13.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.stretch .hold{font-family:var(--display);font-size:14px;letter-spacing:.08em;color:var(--amber);margin-top:4px;font-variant-numeric:tabular-nums}

/* ---------- review tab ---------- */
.revtimes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.revtimes input[type=time]{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:9px 8px;font-size:16px;font-variant-numeric:tabular-nums;
}
.dur{
  font-family:var(--display);font-size:19px;font-weight:600;color:var(--amber);
  padding:8px 4px;font-variant-numeric:tabular-nums;
}
.energy{margin:2px 0 10px}
.energy>label{
  display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:6px;
}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pip{
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:9px 2px 7px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.pip b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.pip span{font-size:9.5px;letter-spacing:.04em}
.pip.on{background:var(--amber);border-color:var(--amber);color:#0E1217}
.revnote{margin-bottom:10px}
.revnote>label{
  display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:4px;
}
.revnote textarea{margin-top:0;min-height:88px}
.revcopy{
  width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:5px;padding:12px;cursor:pointer;margin-bottom:16px;
  font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
}
.revcopy:active{border-color:var(--amber);color:var(--amber)}
.histhead{
  font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dimmer);margin:4px 0 8px;
}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:7px}
.hist.today{border-color:var(--amber)}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hdate{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.hstat{font-family:var(--display);font-size:15px;color:var(--green);font-variant-numeric:tabular-nums}
.hmeta{font-size:12.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.hnote{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.35}

/* ---------- save bar ---------- */
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(14,18,23,.94);backdrop-filter:blur(9px);
  border-top:1px solid var(--line);
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.savebar button{
  border-radius:5px;padding:13px 8px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;
}
.btn-main{background:var(--green);border:0;color:#0E1217}
.btn-alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  background:var(--panel2);border:1px solid var(--amber);color:var(--ink);
  padding:11px 16px;border-radius:5px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:88vw;text-align:center;
}
.toast.show{opacity:1}
.note{padding:14px var(--pad) 0;font-size:12.5px;color:var(--dimmer);line-height:1.45}
.jswarn{
  margin:4px var(--pad) 0;padding:14px;
  border:1px solid var(--amber);border-radius:6px;background:#241C08;
}
.jswarn b{display:block;font-family:var(--display);font-size:17px;letter-spacing:.02em;color:var(--amber);margin-bottom:4px}
.jswarn span{font-size:14px;color:var(--ink);line-height:1.4}
.backup{display:flex;gap:8px;padding:9px var(--pad) 0}
.backup button{
  flex:1;background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:5px;padding:11px 8px;cursor:pointer;
  font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
}
.backup button:active{border-color:var(--amber);color:var(--amber)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

(function(){
  function show(title, detail){
    var w = document.getElementById("jsWarn");
    if(!w) return;
    w.style.display = "block";
    w.innerHTML = "<b>" + title + "</b><span>" + String(detail||"").replace(/[<>]/g,"") + "</span>";
  }
  window.addEventListener("error", function(ev){
    show("Something went wrong loading the app.",
         (ev.message||"Unknown error") + (ev.lineno ? "  (line " + ev.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function(ev){
    show("Something went wrong loading the app.",
         (ev.reason && ev.reason.message) ? ev.reason.message : "Promise rejected");
  });
  // proves scripts execute at all in this viewer
  window.__scriptsRan = true;

  // if scripts ran but the app never drew, say that specifically
  setTimeout(function(){
    var tabs = document.getElementById("tabs");
    var w = document.getElementById("jsWarn");
    if(!w || w.style.display === "block") return;      // already reported something
    if(tabs && tabs.children.length === 0){
      show("Scripts run, but the app didn't finish loading.",
           "Tell Claude you saw this message — it means the code stopped partway, not that the viewer blocked it.");

function waitForStorage(ms){
  const t0 = Date.now();
  return new Promise(resolve=>{
    (function poll(){
      if(typeof window.storage !== "undefined" && window.storage) return resolve(true);
      if(Date.now()-t0 > ms) return resolve(false);

    if(await waitForStorage(700)){ this.mode="claude"; return; }
    try{
      window.localStorage.setItem("__t513x","1");
      window.localStorage.removeItem("__t513x");
      this.mode="local"; return;
    }catch(e){}
    this.mode="memory";
  },
  async get(k){
    if(this.mode==="claude"){
      try{ const r=await window.storage.get(k); return r && r.value; }catch(e){ return null; }
    }
    if(this.mode==="local"){
      try{ return window.localStorage.getItem(k); }catch(e){ return null; }
    }
    return this.mem[k]||null;
  },
  async set(k,v){
    if(this.mode==="claude"){
      try{ await window.storage.set(k,v); return true; }catch(e){ this.mode="local"; }
    }
    if(this.mode==="local"){
      try{ window.localStorage.setItem(k,v); return true; }catch(e){ this.mode="memory"; }
    }
    this.mem[k]=v; return false;
  },
  label(){
    if(this.mode==="local") return "Saved on this phone. Safe to close and come back.";
    if(this.mode==="claude") return "Saving in this window. Tap Save backup before you close it.";
    return "Not saving automatically — tap Save backup to keep your work.";
  }
};

function serialise(){
  return JSON.stringify(state, (k,v)=> k==="_open" ? undefined : v);
}

async function load(){
  await Store.init();
  let raw = await Store.get(KEY);
  if(!raw){ raw = await Store.get(OLD_KEY); }   // carry over anything saved under the old number
  if(raw){
    try{ state = Object.assign(state, JSON.parse(raw)); }catch(e){}
  }
  const rawIdx = await Store.get(IDX);
  if(rawIdx){ try{ index = JSON.parse(rawIdx) || {}; }catch(e){ index = {}; } }
}

function hhmm(d){
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* Stamp the start time the first time she actually does something. */
function stampStart(){
  if(!state.startedAt) state.startedAt = hhmm(new Date());
}

function minutesBetween(a,b){
  if(!a || !b) return null;
  const pa=a.split(":"), pb=b.split(":");
  if(pa.length<2 || pb.length<2) return null;
  let m = (+pb[0]*60 + +pb[1]) - (+pa[0]*60 + +pa[1]);
  if(isNaN(m)) return null;
  if(m < 0) m += 24*60;              // session crossed midnight
  return m;
}

function durationText(){
  const m = minutesBetween(state.startedAt, state.endedAt);
  if(m === null) return "—";
  const h = Math.floor(m/60), r = m%60;
  return h ? h+"h "+r+"m" : r+"m";
}

function summary(){
  const items = trackable();
  return {
    done: items.filter(i=>entry(i.id).done).length,
    total: items.length,
    startedAt: state.startedAt || "",
    endedAt: state.endedAt || "",
    minutes: minutesBetween(state.startedAt, state.endedAt),
    energy: state.energy || 0,
    review: state.review || ""
  };
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    const okNow = await Store.set(KEY, serialise());
    const s = summary();
    if(s.done || s.review || s.energy || s.startedAt){ index[iso] = s; }
    else { delete index[iso]; }
    await Store.set(IDX, JSON.stringify(index));
    if(okNow !== storageOK){ storageOK = okNow; }
    if(okNow) setChip("ok","saved "+hhmm(new Date()));
    else setChip("bad","not saving");
    updateFootNote();
  },250);
}

function entry(id){
  if(!state.log[id]) state.log[id] = {done:false, sets:"", reps:"", weight:"", note:""};
  return state.log[id];
}

/* all trackable items (everything except cooldown, which is guidance) */
function trackable(){
  return [
    ...WARM.map(x=>({...x, zone:"warm"})),
    ...FH.map(x=>({...x, zone:"fh"})),
    ...WR.map(x=>({...x, zone:"wr"})),
    ...state.surprise.map(x=>({...x, zone:"surp"}))
  ];
}

/* ---------------- header + shift light ---------------- */
const SEGS = 14;
function renderHead(){
  const opts = {weekday:"short", day:"numeric", month:"short", year:"numeric"};
  elDate.textContent = today.toLocaleDateString("en-CA", opts).replace(/,/g,"");
  const items = trackable();
  const done = items.filter(i=>entry(i.id).done).length;
  const total = items.length;
  elProg.textContent = done+"/"+total;

  const pct = total ? done/total : 0;
  const lit = Math.round(pct*SEGS);
  const shift = elShift;
  shift.innerHTML = "";
  for(let i=0;i<SEGS;i++){
    const d=document.createElement("div");
    d.className="seg";
    if(i<lit){
      d.classList.add(i < SEGS*0.6 ? "on-g" : (i < SEGS*0.86 ? "on-a" : "on-r"));
    }
    shift.appendChild(d);
  }
  shift.classList.toggle("redline", total>0 && done===total);
}

/* ---------------- tabs ---------------- */
function renderTabs(){
  const tabs = elTabs;
  tabs.innerHTML = "";
  ZONES.forEach(z=>{
    const b=document.createElement("button");
    b.className="tab"; b.type="button"; b.role="tab";
    b.setAttribute("aria-selected", z.id===active ? "true":"false");
    let count="";
    if(z.id!=="cool" && z.id!=="rev"){
      const items = trackable().filter(i=>i.zone===z.id);
      const d = items.filter(i=>entry(i.id).done).length;
      count = d+"/"+items.length;
      if(items.length && d===items.length) b.classList.add("full");
    }
    b.innerHTML = '<span>'+z.short+'</span>'+(count?'<span class="ct">'+count+'</span>':'');
    b.onclick=()=>{ active=z.id; render(); };
    tabs.appendChild(b);
    if(z.id===active){
      requestAnimationFrame(()=>{
        const l = b.offsetLeft - (tabs.clientWidth - b.offsetWidth)/2;
        if(typeof tabs.scrollTo === "function") tabs.scrollTo(Math.max(0,l), 0);
        else tabs.scrollLeft = Math.max(0,l);
      });
    }
  });
}

/* ---------------- rows ---------------- */
const CHECK='<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#0E1217" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function rowEl(item){
  const e = entry(item.id);
  const row=document.createElement("div");
  row.className="row"+(e.done?" done":"")+(e._open?" open":"");

  const presc = item.presc ? item.presc
    : [item.sets && item.sets!=="–" ? item.sets+"×"+item.reps : item.reps, item.load].filter(Boolean).join(" · ");

  const top=document.createElement("div"); top.className="rowtop";

  const tick=document.createElement("button");
  tick.className="tick"; tick.type="button";
  tick.setAttribute("aria-label", (e.done?"Mark not done: ":"Mark done: ")+item.name);
  tick.setAttribute("aria-pressed", e.done?"true":"false");
  tick.innerHTML='<span class="box">'+CHECK+'</span>';
  tick.onclick=()=>{
    stampStart();
    e.done=!e.done;
    if(e.done && !e.weight && !e.reps){ e.weight=item.load||""; e.reps=item.reps||""; e.sets=item.sets||""; }
    save(); render();
  };

  const meta=document.createElement("button");
  meta.className="meta"; meta.type="button";
  meta.setAttribute("aria-expanded", e._open?"true":"false");
  meta.innerHTML =
    '<div class="name"></div>'+
    '<div class="presc"></div>'+
    (item.musc?'<div class="musc"></div>':'')+
    (item.cue?'<div class="cue"></div>':'');
  meta.querySelector(".name").textContent=item.name;
  meta.querySelector(".presc").textContent=presc;
  if(item.musc) meta.querySelector(".musc").textContent=item.musc;
  if(item.cue) meta.querySelector(".cue").textContent=item.cue;
  meta.onclick=()=>{ e._open=!e._open; save(); render(); };

  top.appendChild(tick); top.appendChild(meta);
  row.appendChild(top);

  const dr=document.createElement("div"); dr.className="drawer";
  dr.innerHTML =
    '<div class="fields">'+
      '<div class="field"><label>Sets</label><input inputmode="numeric" data-k="sets"></div>'+
      '<div class="field"><label>Reps</label><input inputmode="text" data-k="reps"></div>'+
      '<div class="field"><label>Weight</label><input inputmode="text" data-k="weight"></div>'+
    '</div>'+
    '<textarea data-k="note" placeholder="How did it feel?"></textarea>'+
    '<button class="rest" type="button">Rest 30s</button>';

  dr.querySelectorAll("input,textarea").forEach(inp=>{
    const k=inp.dataset.k;
    inp.value=e[k]||"";
    if(k==="sets") inp.placeholder=item.sets||"";
    if(k==="reps") inp.placeholder=item.reps||"";
    if(k==="weight") inp.placeholder=item.load||"";
    inp.oninput=()=>{ stampStart(); e[k]=inp.value; save(); renderHead(); };
  });

  const rest=dr.querySelector(".rest");
  rest.onclick=()=>{
    if(rest.dataset.run) return;
    let t=30; rest.dataset.run="1"; rest.classList.add("running");
    rest.textContent="Rest "+t+"s";
    const iv=setInterval(()=>{
      t--; rest.textContent = t>0 ? "Rest "+t+"s" : "Go";
      if(t<=0){ clearInterval(iv); setTimeout(()=>{
        rest.textContent="Rest 30s"; rest.classList.remove("running"); delete rest.dataset.run;
      },1400); }
    },1000);
  };

  row.appendChild(dr);
  return row;
}

/* ---------------- surprise me ---------------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function roll(){
  let picks=[];
  if(state.mode==="Balanced Mix"){
    ZONE_NAMES.forEach(z=>{
      const pool=DB.filter(x=>x.z===z);
      if(pool.length) picks.push(pool[Math.floor(Math.random()*pool.length)]);
    });
  }else{
    const z = state.zone==="Random" ? ZONE_NAMES[Math.floor(Math.random()*ZONE_NAMES.length)] : state.zone;
    picks = shuffle(DB.filter(x=>x.z===z)).slice(0,5);
  }
  // clear old surprise log entries so counts stay honest
  state.surprise.forEach(s=>{ delete state.log[s.id]; });
  state.surprise = picks.map((p,i)=>({
    id:"s"+i, name:p.n, sets:p.s, reps:p.r, load:p.l, musc:p.m+" · "+p.z
  }));
  save(); render();
}

/* ---------------- main render ---------------- */
function render(){
  renderHead(); renderTabs();
  const z = ZONES.find(x=>x.id===active);
  const main=elMain;
  main.innerHTML="";

  const h=document.createElement("div"); h.className="zonehead";
  h.innerHTML='<h2></h2><p></p>';
  h.querySelector("h2").textContent=z.title;
  h.querySelector("p").textContent=z.sub;
  main.appendChild(h);

  if(active==="warm") WARM.forEach(i=>main.appendChild(rowEl(i)));
  if(active==="fh")   FH.forEach(i=>main.appendChild(rowEl(i)));
  if(active==="wr")   WR.forEach(i=>main.appendChild(rowEl(i)));

  if(active==="surp"){
    const c=document.createElement("div"); c.className="controls";
    c.innerHTML=
      '<div class="field"><label>Mode</label><select id="selMode">'+
        '<option>Balanced Mix</option><option>Isolate a Body Area</option></select></div>'+
      '<div class="field"><label>Target zone</label><select id="selZone">'+
        ['Random',...ZONE_NAMES].map(o=>'<option>'+o+'</option>').join("")+'</select></div>';
    main.appendChild(c);
    const sm=c.querySelector("#selMode"), sz=c.querySelector("#selZone");
    sm.value=state.mode; sz.value=state.zone;
    sz.disabled = state.mode==="Balanced Mix";
    sm.onchange=()=>{ state.mode=sm.value; save(); render(); };
    sz.onchange=()=>{ state.zone=sz.value; save(); };

    const b=document.createElement("button");
    b.className="roll"; b.type="button";
    b.textContent = state.surprise.length ? "Roll again" : "Roll a workout";
    b.onclick=roll;
    main.appendChild(b);

    if(!state.surprise.length){
      const e=document.createElement("div"); e.className="empty";
      e.textContent="Balanced Mix pulls one exercise from each of Legs, Upper Body, Core, Mobility/Hip and Cardio. Isolate pulls up to five from a single zone.";
      main.appendChild(e);
    } else {
      state.surprise.forEach(i=>main.appendChild(rowEl(i)));
    }
  }

  if(active==="rev"){
    const s0 = summary();

    const times=document.createElement("div");
    times.className="revtimes";
    times.innerHTML =
      '<div class="field"><label>Start</label><input type="time" id="tStart"></div>'+
      '<div class="field"><label>End</label><input type="time" id="tEnd"></div>'+
      '<div class="field"><label>Duration</label><div class="dur" id="durOut"></div></div>';
    main.appendChild(times);
    const tS=times.querySelector("#tStart"), tE=times.querySelector("#tEnd");
    tS.value=state.startedAt||""; tE.value=state.endedAt||"";
    times.querySelector("#durOut").textContent=durationText();
    tS.onchange=()=>{ state.startedAt=tS.value; save(); render(); };
    tE.onchange=()=>{ state.endedAt=tE.value; save(); render(); };

    const endBtn=document.createElement("button");
    endBtn.className="roll"; endBtn.type="button";
    endBtn.textContent = state.endedAt ? "Update end time to now" : "End session now";
    endBtn.onclick=()=>{ stampStart(); state.endedAt=hhmm(new Date()); save(); render(); };
    main.appendChild(endBtn);

    const en=document.createElement("div");
    en.className="energy";
    en.innerHTML='<label>Energy through the session</label><div class="pips"></div>';
    const pips=en.querySelector(".pips");
    ["Drained","Low","OK","Good","Flying"].forEach((lab,i)=>{
      const v=i+1;
      const p=document.createElement("button");
      p.type="button"; p.className="pip"+(state.energy===v?" on":"");
      p.innerHTML='<b>'+v+'</b><span>'+lab+'</span>';
      p.onclick=()=>{ state.energy = (state.energy===v?0:v); save(); render(); };
      pips.appendChild(p);
    });
    main.appendChild(en);

    const rv=document.createElement("div");
    rv.className="field revnote";
    rv.innerHTML='<label>How did it go?</label>'+
      '<textarea id="revNote" placeholder="What went well, what felt hard, how your body responded..."></textarea>';
    main.appendChild(rv);
    const rt=rv.querySelector("#revNote");
    rt.value=state.review||"";
    rt.oninput=()=>{ state.review=rt.value; save(); };

    const cp=document.createElement("button");
    cp.className="revcopy"; cp.type="button";
    cp.textContent="Copy session summary";
    cp.onclick=copySummary;
    main.appendChild(cp);

    // ---- history -------------------------------------------------------
    const dates=Object.keys(index).sort().reverse();
    const hh=document.createElement("div"); hh.className="histhead";
    hh.textContent = dates.length ? "Past sessions" : "";
    main.appendChild(hh);

    if(!dates.length){
      const e0=document.createElement("div"); e0.className="empty";
      e0.textContent="Once you finish a few sessions, they stack up here so you can see how energy and effort move around.";
      main.appendChild(e0);
    }
    dates.forEach(dt=>{
      const r=index[dt]||{};
      const card=document.createElement("div"); card.className="hist"+(dt===iso?" today":"");
      const dur = r.minutes==null ? "—" : (r.minutes>=60 ? Math.floor(r.minutes/60)+"h "+(r.minutes%60)+"m" : r.minutes+"m");
      card.innerHTML =
        '<div class="hrow"><span class="hdate"></span><span class="hstat"></span></div>'+
        '<div class="hmeta"></div>'+
        (r.review?'<div class="hnote"></div>':'');
      card.querySelector(".hdate").textContent = dt + (dt===iso?"  ·  today":"");
      card.querySelector(".hstat").textContent = (r.done||0)+"/"+(r.total||0);
      card.querySelector(".hmeta").textContent =
        [ (r.startedAt&&r.endedAt) ? r.startedAt+"–"+r.endedAt : null,
          dur!=="—" ? dur : null,
          r.energy ? "energy "+r.energy+"/5" : null
        ].filter(Boolean).join("  ·  ") || "no times logged";
      if(r.review) card.querySelector(".hnote").textContent = r.review;
      main.appendChild(card);
    });
  }

  if(active==="cool"){
    COOL.forEach(s=>{
      const d=document.createElement("div"); d.className="stretch";
      d.innerHTML='<div class="grp"></div><div class="how"></div><div class="hold"></div>';
      d.querySelector(".grp").textContent=s.grp;
      d.querySelector(".how").textContent=s.how;
      d.querySelector(".hold").textContent=s.hold;
      main.appendChild(d);
    });
  }

  updateFootNote();
}

function updateFootNote(){
  elFoot.textContent = Store.label();
}

/* ---------------- export ---------------- */
const HEADERS = ["Date","Trainer/Session","Exercise","Sets","Reps","Weight","Feedback / How it felt"];

function rows(){
  const out=[];
  trackable().forEach(i=>{
    const e=entry(i.id);
    if(!e.done && !e.sets && !e.reps && !e.weight && !e.note) return;
    const z=ZONES.find(x=>x.id===i.zone);
    out.push([
      iso,
      z ? z.session : "",
      i.name,
      e.sets || i.sets || "",
      e.reps || i.reps || "",
      e.weight || i.load || "",
      [e.note, e.done ? "" : "not completed"].filter(Boolean).join(" — ")
    ]);
  });
  return out;
}

function toast(msg){
  const t=elToast;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600);
}

elCsv.onclick=()=>{
  const r=rows();
  if(!r.length){ toast("Nothing logged yet — tick something off first."); return; }
  const esc=v=>/[",\n]/.test(v) ? '"'+String(v).replace(/"/g,'""')+'"' : v;
  const csv=[HEADERS,...r].map(line=>line.map(esc).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="workout-log-"+iso+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("Saved "+r.length+" row"+(r.length>1?"s":"")+" as CSV.");
};

elCopy.onclick=async ()=>{
  const r=rows();
  if(!r.length){ toast("Nothing logged yet — tick something off first."); return; }
  const tsv=r.map(line=>line.join("\t")).join("\n");
  try{
    await navigator.clipboard.writeText(tsv);
    toast(r.length+" row"+(r.length>1?"s":"")+" copied. Paste into your Workout Log.");
  }catch(err){
    const ta=document.createElement("textarea");
    ta.value=tsv; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Rows copied. Paste into your Workout Log."); }
    catch(e2){ toast("Couldn't copy here — use Download CSV instead."); }
    ta.remove();
  }
};

const SUMMARY_HEADERS = ["Date","Start","End","Duration (min)","Completed","Energy (1-5)","Review notes"];

function summaryRow(){
  const s0=summary();
  return [ iso, s0.startedAt||"", s0.endedAt||"",
           s0.minutes==null?"":String(s0.minutes),
           s0.done+"/"+s0.total,
           s0.energy?String(s0.energy):"",
           s0.review||"" ];
}

async function copySummary(){
  const line=summaryRow().join("\t");
  try{
    await navigator.clipboard.writeText(line);
    toast("Session summary copied. Paste into the Session Review sheet.");
  }catch(err){
    const ta=document.createElement("textarea");
    ta.value=line; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Session summary copied."); }
    catch(e2){ toast("Couldn't copy here."); }
    ta.remove();
  }
}

/* ---------------- backup / restore ---------------- */
elBackup.onclick=async ()=>{
  // pull every stored session so the backup is a full history, not just today
  const sessions={};
  const dates=Object.keys(index);
  if(dates.indexOf(iso)===-1) dates.push(iso);
  for(const dt of dates){
    if(dt===iso){ sessions[dt]=JSON.parse(serialise()); continue; }
    const raw=await Store.get("session513x:"+dt);
    if(raw){ try{ sessions[dt]=JSON.parse(raw); }catch(e){} }
  }
  const payload={ app:"session513x", version:2, exported:iso, index:index, sessions:sessions };
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="session-513x-all-"+iso+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast("Backed up "+Object.keys(sessions).length+" session"+(Object.keys(sessions).length>1?"s":"")+".");
};

elRestore.onclick=()=>elFile.click();
elFile.onchange=()=>{
  const f=elFile.files && elFile.files[0];
  if(!f) return;
  const fr=new FileReader();
  fr.onload=async ()=>{
    try{
      const incoming=JSON.parse(fr.result);
      if(!incoming || typeof incoming!=="object") throw new Error("bad shape");

      if(incoming.sessions && typeof incoming.sessions==="object"){
        // full-history backup
        let n=0;
        for(const dt of Object.keys(incoming.sessions)){
          await Store.set("session513x:"+dt, JSON.stringify(incoming.sessions[dt]));
          n++;
        }
        index = Object.assign({}, incoming.index||{});
        await Store.set(IDX, JSON.stringify(index));
        const mine=incoming.sessions[iso];
        if(mine) state=Object.assign({log:{},surprise:[],mode:"Balanced Mix",zone:"Random",
                                      startedAt:"",endedAt:"",energy:0,review:""}, mine);
        render();
        toast("Restored "+n+" session"+(n>1?"s":"")+".");
      } else if(incoming.log){
        // older single-day backup
        state=Object.assign({log:{},surprise:[],mode:"Balanced Mix",zone:"Random",
                             startedAt:"",endedAt:"",energy:0,review:""}, incoming);
        save(); render();
        toast("Backup restored.");
      } else { throw new Error("bad shape"); }
    }catch(e){
      toast("That file isn't a Session 513X backup.");
    }
    elFile.value="";
  };
  fr.onerror=()=>{ toast("Couldn't read that file."); elFile.value=""; };
  fr.readAsText(f);
};

/* nudge before an accidental close if there's work that isn't on the phone yet */
window.addEventListener("beforeunload", e=>{
  if(Store.mode==="local") return;          // already safe on the device
  if(!rows().length) return;                // nothing logged, nothing to lose
  e.preventDefault(); e.returnValue="";
});

/* ---------------- boot ---------------- */
(async ()=>{
  const warn = document.getElementById("jsWarn");
  if(warn) warn.style.display = "none";   // scripts run here, so hide the notice
  render();              // paint straight away so there's never a blank screen
  await load();
  render();              // then fill in anything that was saved

  // tell her plainly whether this browser will keep her work
  if(Store.mode === "local"){
    const items = trackable().filter(i=>entry(i.id).done).length;
    setChip("ok", items ? "saved · restored" : "saves on this phone");
  } else if(Store.mode === "claude"){
    setChip(null, "saves in this window");
  } else {
    setChip("bad", "not saving — see below");
  }
})();
